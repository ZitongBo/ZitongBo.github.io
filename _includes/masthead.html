{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
    <div class="lang-toggle-wrap">
      <button id="lang-toggle" class="lang-toggle" aria-label="切换语言">
        <span class="lang-zh">中</span>
        <span class="lang-sep">/</span>
        <span class="lang-en">EN</span>
      </button>
    </div>
  </div>
</div>

<style>
.masthead__inner-wrap {
  display: flex;
  align-items: center;
}
.masthead__menu {
  flex: 1;
}
.lang-toggle-wrap {
  flex-shrink: 0;
  padding-left: 1em;
}
.lang-toggle {
  background: transparent;
  border: 1px solid #c8c8c8;
  border-radius: 3px;
  padding: 3px 10px;
  font-size: 0.75em;
  cursor: pointer;
  color: #494e52;
  letter-spacing: 0.05em;
  line-height: 1.6;
  transition: all 0.15s;
  white-space: nowrap;
}
.lang-toggle:hover {
  border-color: #52adc8;
  color: #52adc8;
}
.lang-toggle .lang-zh,
.lang-toggle .lang-en {
  font-weight: 400;
  transition: font-weight 0.1s;
}
.lang-toggle .lang-sep {
  margin: 0 2px;
  opacity: 0.4;
}
body.lang-zh .lang-toggle .lang-zh,
body.lang-en .lang-toggle .lang-en {
  font-weight: 700;
  color: #52adc8;
}
</style>

<script>
(function () {
  var lang = localStorage.getItem('site-lang') || 'en';
  document.body.classList.add('lang-' + lang);

  function applyLang(l) {
    document.body.classList.remove('lang-zh', 'lang-en');
    document.body.classList.add('lang-' + l);
    localStorage.setItem('site-lang', l);
  }

  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('lang-toggle');
    if (!btn) return;
    applyLang(lang);
    btn.addEventListener('click', function () {
      var current = localStorage.getItem('site-lang') || 'en';
      applyLang(current === 'en' ? 'zh' : 'en');
    });
  });
})();
</script>
